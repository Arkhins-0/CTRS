<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Offline · CTR Sports Admin</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: #f4f4f4;
        color: #1a1a1a;
        font-family: "Titillium Web", "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
        border: 1px solid #e5e5e5;
        background: #ffffff;
        padding: 2.5rem 1.75rem;
        border-radius: 8px;
      }
      img { width: 108px; height: auto; margin-bottom: 1.5rem; }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      p { margin: 0; font-size: 0.875rem; line-height: 1.6; color: #666666; }
      button {
        margin-top: 1.75rem;
        min-height: 44px;
        padding: 0 1.5rem;
        border: 0;
        background: #f7d619;
        color: #0a0a0a;
        font: inherit;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        cursor: pointer;
        border-radius: 999px;
      }
      button:hover { background: #e0bf06; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="CTR Sports" />
      <h1>No connection</h1>
      <p>
        The admin console needs a network connection — its pages are never stored on your device.
        Reconnect and try again.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
